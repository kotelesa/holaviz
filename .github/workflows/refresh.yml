name: Napi frissítés és publikálás

on:
  schedule:
    # A GitHub ütemezője "best effort": kerek perceknél órákat késhet vagy ki is
    # maradhat (2026-08-06-án pl. egy futás sem indult el). Ezért több, elcsúsztatott,
    # nem kerek perces időpont — az első sikeres futás kiteszi a friss adatot,
    # a többi ártalmatlan ismétlés. Az időpontok UTC-ben értendők (nyáron +2 óra).
    # A friss reggeli észlelés jellemzően délelőtt (~9:45 körül) jelenik meg
    # a hydroinfo.hu-n — a 10 körüli futás kapja el leghamarabb, a korábbiak
    # arra jók, ha egyszer hamarabb publikálnának.
    - cron: '7 6 * * *'    # ~8:07 magyar idő (nyáron)
    - cron: '4 7 * * *'    # ~9:04
    - cron: '3 8 * * *'    # ~10:03
    - cron: '41 8 * * *'   # ~10:41
    - cron: '11 10 * * *'  # ~12:11
    - cron: '17 13 * * *'  # ~15:17 — délutáni biztosíték
  push:
    branches: [main]
  workflow_dispatch:        # kézi indítás az Actions fülről

permissions:
  contents: write   # a frissítési napló commitjához (lásd az utolsó lépést)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ha a letöltés vagy az ellenőrzés hibázik, itt elhal a futás,
      # és a tegnapi oldal marad kint — félkész állapot sosem kerül ki.
      - name: Élő adatok letöltése és oldal összeállítása
        run: |
          python fetch_live.py
          python build_page.py
          mkdir -p _site
          cp holaviz.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      # A GitHub a publikus repók ütemezett workflow-it automatikusan letiltja,
      # ha a repóban 60 napig nincs aktivitás (commit) — 2026-10-30-án emiatt
      # állt le a frissítés, hiba és figyelmeztetés nélkül. Ezért minden újonnan
      # publikált észlelési nap egy sort kap a frissítési naplóban: ez a napi
      # commit tartja életben az ütemezést, a naplóból pedig utólag az is
      # látszik, mely napokon maradt el a frissítés.
      # (A GITHUB_TOKEN-nel tolt commit nem indít újabb futást, így nincs hurok.)
      - name: Frissítési napló vezetése
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          day=$(jq -r '.obs_iso // empty' live_data.json)
          if [ -z "$day" ]; then
            echo "::warning title=Frissítési napló::Nincs észlelési dátum a letöltött adatban, a naplózás kimarad."
            exit 0
          fi
          log=frissitesi-naplo.csv
          [ -f "$log" ] || echo "eszleles_napja,publikalva_utc" > "$log"
          if grep -q "^$day," "$log"; then
            echo "A(z) $day észlelés már szerepel a naplóban — nincs teendő."
            exit 0
          fi
          echo "$day,$(date -u +%Y-%m-%dT%H:%MZ)" >> "$log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log"
          git commit -q -m "Frissítési napló: $day"
          # a build helyi termékei (holaviz.html, live_data.json) ekkorra már
          # kint vannak az oldalon — eldobjuk őket, hogy a rebase tiszta legyen
          git reset -q --hard
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "Naplózva: $day"
